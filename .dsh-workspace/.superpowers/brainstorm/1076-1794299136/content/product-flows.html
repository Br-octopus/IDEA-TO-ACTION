document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));if(route==='workbench'&&workMode==='chat'&&viewState==='normal'){const frame=$('work-frame');frame.onload=()=>{const d=frame.contentDocument;const style=d.createElement('style');style.textContent='.design-header,.sidebar,.comparison,.demo-controls,.topbar{display:none!important}body{background:white}.canvas{margin:0;border:0;border-radius:0;box-shadow:none;max-width:none}.app{height:100dvh;min-height:0}.landing{padding:25px}.greeting{font-size:27px}.work-panel{min-height:0}';d.head.append(style);frame.contentWindow.eval('layout="a";setState('+JSON.stringify(frameState)+')')};}}

function reader(){let content;if(readerKind==='网站'||readerKind==='HTML')content='<div class="site-nav"><strong>NORTH / 产品设计示例</strong><span>产品 · 方法 · 关于</span></div><h2 id="target-title">让每一个想法，<br>都有清晰的下一步。</h2><p>一个帮助你梳理目标、整理资料和形成可执行提示词的工作空间。</p><blockquote><mark id="target-text">只需要输入一个想法，系统就会自动完成所有工作。</mark></blockquote><div class="region-example" id="target-region"><span class="region-number">2</span><strong>从讨论，到行动。</strong><p>理解任务 → 整理资料 → 确定下一步</p></div><p>选中这段页面文字，可以添加文字批注；也可以使用工具栏体验区域批注的示例。</p>';else if(readerKind==='PPT')content='<span class="pill">第 3 页 / 页面呈现示意</span><h2 id="target-title">产品价值与<br>实施路径</h2><blockquote><mark id="target-text">只需要输入一个想法，系统就会自动完成所有工作。</mark></blockquote><div class="region-example" id="target-region"><span class="region-number">2</span>目标 → 资料 → 决策 → 行动</div>';else if(readerKind==='图片')content='<span class="pill">图片区域批注示意</span><div class="region-example" id="target-region" style="min-height:260px;display:grid;place-items:center;background:#edf1e4"><span class="region-number">2</span><div><h2>让想法有下一步。</h2><p>主视觉 / 标题与信息层次</p></div></div>';else content='<div class="site-nav">产品方案说明 / 文档示例</div><h2 id="target-title">为什么需要一个<br>任务工作台</h2><p>用户的想法、资料与反馈分散在不同窗口，很难形成持续推进的过程。</p><blockquote><mark id="target-text">只需要输入一个想法，系统就会自动完成所有工作。</mark></blockquote><p>我们希望把任务理解、资料组织和提示词生成放在一个清晰的流程里。</p><div class="region-example" id="target-region"><span class="region-number">2</span>当前范围：辅助组织修改要求，保留用户决策。</div>';

function generated(){return '<div class="generated"><span class="pill">当前任务 / 修改指令草稿</span><h2>把意见整理成下一步。</h2><p>按资料、位置和批注意见组织，供你交给执行工具。</p><div class="source-links"><button data-work-mode="reader">查看原资料与批注 ↗</button><span class="pill">示例快照 V1</span></div><textarea id="generated-text" aria-label="修改提示词草稿" class="prompt-body" style="width:100%;margin-top:20px;resize:vertical">'+esc(promptDraft||'请根据所附资料与批注修改产品介绍页面。\n\n1. 定位“系统就会自动完成所有工作”，改为准确说明需求梳理和修改提示词生成能力。\n2. 在流程说明区域突出“确定下一步”，降低辅助步骤的视觉权重。\n\n保留页面的原有信息结构；不夸大能力。请逐项说明修改结果。\n\n随附资料：原页面快照与第 2 条批注的区域截图。')+'</textarea><p class="small">图片不会随纯文本复制自动附带；正式产品会列出所需附件。</p><div class="actions"><button class="primary" id="copy-generated">复制提示词</button><button data-work-mode="reader">返回批注</button></div></div>'}

-item active"><strong>先明确决策，再整理内容</strong><small>通用 / 内置方法示例</small></button><button class="list-item" data-note="方法卡分别展示适用条件、步骤和版本，不与提示词正文混排。"><strong>先诊断，再迭代</strong><small>写作 / 方法示例</small></button></aside><article class="detail"><span class="pill">方法卡</span><h2 style="margin-top:15px">先明确决策，再整理内容</h2><p>适用于汇报、提案和方案讨论。</p>'+['明确听众要做出的决定','确认已有事实与缺少的依据','选择支持决策的内容顺序'].map((x,i)=>'<div class="plan-step"><span class="number">'+(i+1)+'</span><strong>'+x+'</strong></div>').join('')+'<div class="actions"><button class="primary" data-use="决策导向方法卡">在任务中使用</button><button data-modal="method-edit">编辑自建方法卡</button></div></article></div>';return '<div class="page-inner">'+heading('提示词收藏','保留有效的方法，下一次直接接着用。','<button class="primary" data-modal="prompt-edit">＋ 新建提示词</button>')+tabs(['提示词','案例','方法卡'])+body+'</div>'}
function writing(){return '<div class="page-inner">'+heading('写作','围绕同一篇文章，持续推进每一轮修改。','<button class="primary" data-modal="article-new">＋ 新建文章</button>')+tabs(['文章','文体与专业包'])+(subtabs.writing==='文章'?'<div class="article-layout"><aside class="article-list">'+['把想法写清楚','一篇产品更新说明'].map((x,i)=>'<button class="list-item '+(selectedArticle===i?'active':'')+'" data-article="'+i+'"><strong>'+x+'</strong><small>'+(i===0?'第 3 轮 · 结构调整':'第 1 轮 · 初稿诊断')+'</small></button>').join('')+'</aside><article class="manuscript"><span class="pill">'+(selectedArticle===0?'普通文章 / 本轮稿件':'产品说明 / 本轮稿件')+'</span><h2>'+(selectedArticle===0?'把想法写清楚，<br>先从一个问题开始。':'更新不只是列出<br>新增了什么。')+'</h2><p>很多时候，我们不是没有想法，而是不知道先讲哪一句。材料越多，越容易把所有信息都放在开头。</p><p><span class="retained">我更希望文章从一个具体的问题开始，让读者知道这件事与自己有什么关系。</span></p><p>这一轮先调整结构，保留原有的个人经历与核心观点。细节润色留到下一轮。</p><div class="actions"><button class="primary" data-modal="writing-round">开始下一轮修改</button><button data-review>查看与批注</button></div></article><aside class="revision"><h3>修改轮次</h3><ol class="timeline"><li><strong>第 3 轮 · 结构调整</strong><small>当前轮次 / 示例</small></li><li>第 2 轮 · 精简表达<small>已保存提示词</small></li><li>第 1 轮 · 目标与读者<small>已确认方向</small></li></ol><h3>本轮保留</h3><p class="small">个人经历、第一人称表达、核心观点。</p><button data-modal="retained">调整保留要求</button></aside></div>':'<div class="feature-pair"><article class="surface"><span class="pill">当前文体</span><h2 style="margin-top:16px">普通文章</h2><p>先保持结构清楚、表达自然，再按任务选择附加方法。</p><label for="genre-select">文体</label><select id="genre-select"><option>普通文章</option><option>学术写作</option><option>口播与演讲</option><option>长篇叙事</option></select><div class="actions"><button data-note="文体变更先影响下一轮，当前轮次已使用的专业包版本保留。">用于下一轮</button></div></article><article class="surface"><h2>专业包</h2><label class="checkline"><input type="checkbox" checked> 结构与表达检查</label><label class="checkline"><input type="checkbox"> 事实与来源检查</label><label class="checkline"><input type="checkbox"> 自建风格参考</label><p>确认后固定本轮使用的版本，历史轮次保持可追溯。</p><button data-modal="pack-preview">预览本轮选择</button></article></div>')+'</div>'}
function research(){let body;if(subtabs.research==='学术')body='<div class="toolbar"><span class="pill">项目：任务工作台研究 · 示例</span><button data-modal="academic-new">切换 / 新建项目</button><button data-modal="bibliography">导入题录</button><button data-modal="reviewer">审稿回应</button></div><div class="table-wrap"><table><thead><tr><th>文献 / 证据条目</th><th>研究问题</th><th>筛选状态</th><th>下一步</th></tr></thead><tbody><tr><td><strong>人机协作中的反馈定位</strong><small>演示条目，不是真实论文引用</small></td><td>反馈如何对应原内容</td><td><span class="pill">拟纳入</span></td><td><button data-modal="evidence">查看证据卡</button></td></tr><tr><td><strong>文本批注与版本变化</strong><small>演示条目，不是真实论文引用</small></td><td>改版后定位是否可靠</td><td><span class="pill pending">待评估</span></td><td><button data-modal="evidence">评估条目</button></td></tr></tbody></table></div><div class="surface" style="margin-top:25px"><h2>当前研究问题</h2><p>哪些资料定位方式能支持用户持续修改，而不丢失批注意图？</p><div class="actions"><button class="primary" data-note="根据所选证据生成研究提示词，正式版本会保留出处与未验证标记。">整理研究提示词</button><button data-modal="submission">投稿要求</button></div></div>';else body='<div class="feature-pair"><section class="surface"><span class="pill pending">研究计划 / 待确认</span><h2 style="margin-top:16px">人们怎样整理 AI 修改意见？</h2><p>先确认范围，再采集，结果逐条保留来源。</p>'+['确定平台与关键词','检查采集范围和预算','确认后运行并整理结果'].map((x,i)=>'<div class="plan-step"><span class="number">'+(i+1)+'</span><div><strong>'+x+'</strong><p>'+['小红书、B 站、微博、知乎按需选择。','展示查询数、结果数和附件保存范围。','区分真实结果、失败与未登录状态。'][i]+'</p></div></div>').join('')+'<div class="actions"><button class="primary" data-modal="social-plan">检查并确认计划</button></div></section><section class="surface"><h2>结果与来源</h2><p>当前示例计划尚未运行。</p><div class="empty" style="min-height:230px">'+icon('research')+'<p>确认计划后，结果将在这里按来源展示。</p><button data-modal="social-results">查看结果页设计</button></div></section></div>';return '<div class="page-inner">'+heading('研究','让资料、判断和来源留在同一个流程里。')+tabs(['学术','社媒'])+body+'</div>'}

function settings(){let content;if(subtabs.settings==='通用')content='<h2>通用偏好</h2><div class="setting-row"><div><h3>默认任务入口</h3><p>新任务可以随时改变方向。</p></div><select aria-label="默认任务入口"><option>梳理想法</option><option>优化提示词</option><option>诊断结果</option></select></div><div class="setting-row"><div><h3>界面主题</h3><p>与宿主保持一致，减少视觉割裂。</p></div><select aria-label="主题"><option>跟随宿主</option><option>浅色</option><option>深色</option></select></div><div class="actions"><button class="primary" data-note="演示：偏好已应用到当前草图交互，未写入真实设置。">保存偏好</button></div>';else if(subtabs.settings==='模型与连接')content='<h2>模型与连接</h2><div class="setting-row"><div><h3>任务模型</h3><p>复用宿主配置的提供方和模型。</p></div><span class="pill pending">等待读取宿主</span></div><div class="setting-row"><div><h3>搜索服务</h3><p>按需设置，不影响本地资料查看。</p></div><button data-modal="connection">配置连接</button></div><div class="setting-row"><div><h3>连接检查</h3><p>接口存在与真实请求成功分别显示。</p></div><button data-note="演示：此处应运行连接检查并返回真实状态。本草图没有连接服务。">检查状态</button></div>';else if(subtabs.settings==='备份与恢复')content='<h2>备份与恢复</h2><div class="backup-options"><article class="surface"><h2>保存一份副本</h2><p>包含任务、资料关联与批注，导出前查看范围。</p><button class="primary" data-modal="backup-export">创建备份</button></article><article class="surface"><h2>从副本恢复</h2><p>先预览内容与冲突，再选择合并或替换。</p><button data-modal="backup-restore">选择备份</button></article></div><h3>最近记录</h3><p class="small">暂无真实备份记录；实际结果显示时间、范围和执行状态。</p>';else content='<h2>迁移旧工作空间</h2><p class="small">把旧工具中的任务、资料和提示词带到这里。</p><div class="import-zone"><h3>选择 JSON 或完整 ZIP 备份</h3><p class="small">识别类别 → 检查冲突 → 确认导入</p><button data-modal="migration-preview">查看导入预览示例</button></div>';return '<div class="page-inner">'+heading('设置','常用偏好集中管理，复杂操作按步骤展开。')+'<div class="settings-layout"><nav class="settings-menu" aria-label="设置分类">'+['通用','模型与连接','备份与恢复','迁移'].map(x=>'<button data-sub="'+x+'" class="'+(subtabs.settings===x?'active':'')+'">'+x+'</button>').join('')+'</nav><section class="setting-group">'+content+'</section></div></div>'}
function showNamedModal(name){const contents={import:['添加资料','<p>选择入口后再填写所需信息。</p><div class="actions"><button data-modal="file-import">本地文件</button><button data-modal="url-import">网页链接</button><button data-modal="text-import">粘贴文本</button></div>'],'file-import':['添加本地文件','<p>正式产品将选择文件并显示解析结果。此草图不读取你的文件。</p><label>材料用途</label><select><option>内容来源</option><option>风格参考</option><option>两者都有</option></select>'],'url-import':['添加网页','<label for="url-value">网页链接</label><input id="url-value" placeholder="https://…"><p>保存来源和捕获时间；页面获取失败时保留输入，并提供重试与快照导入入口。</p>'],'text-import':['粘贴资料','<label for="material-text">资料正文</label><textarea id="material-text" placeholder="粘贴你要保留的内容…"></textarea>'],'prompt-edit':['编辑提示词副本','<label for="prompt-title">标题</label><input id="prompt-title" value="'+esc(promptEntries[selectedPrompt].title)+'"><label for="prompt-editor">正文</label><textarea id="prompt-editor">'+esc(promptEntries[selectedPrompt].body)+'</textarea><p>保存时形成新版本，旧版本保留。</p>'],'method-edit':['自建方法卡','<label>方法名称</label><input value="先明确决策，再整理内容"><label>适用场景与步骤</label><textarea>汇报、提案和方案讨论。先确认要做出的决定，再整理支持它的证据。</textarea>'],'article-new':['开始一篇文章','<label>文章名称</label><input placeholder="先给这篇文章起个名字"><label>你想表达什么？</label><textarea placeholder="可以只有一个想法…"></textarea>'],'writing-round':['这一轮最想改什么？','<label>修改重点</label><select><option>结构与逻辑</option><option>表达与风格</option><option>事实与证据</option></select><label>补充意见</label><textarea placeholder="说说当前最不满意的地方…"></textarea>'],'retained':['本轮需要保留什么？','<label>保留要求</label><textarea>个人经历\n第一人称表达\n核心观点</textarea>'],'pack-preview':['本轮专业包预览','<p>结构与表达检查 · 示例 V1</p><p>确认后固定当前轮次的选择，后续更换从新轮次开始。</p>'],'academic-new':['研究项目','<label>项目名称</label><input placeholder="给研究主题起个名字"><label>研究问题</label><textarea placeholder="这次想回答什么问题？"></textarea>'],'bibliography':['导入题录','<label>RIS / BibTeX</label><textarea placeholder="粘贴题录内容…"></textarea><p>先预览有效条目、重复项与格式问题，再确认导入。</p>'],'evidence':['文献证据卡','<p><strong>人机协作中的反馈定位</strong> · 演示条目</p><label>与研究问题的关系</label><textarea>关注批注如何对应原文，以及内容更新后如何检查定位。</textarea><label>筛选结论</label><select><option>待评估</option><option>纳入</option><option>排除</option></select><p>正式数据必须保留原始文献出处。</p>'],'reviewer':['审稿回应','<label>审稿意见</label><textarea placeholder="保留审稿人原文…"></textarea><label>回复草稿</label><textarea placeholder="说明采取的修改或不修改理由…"></textarea><p>回复计划和实际完成修改分别记录。</p>'],'submission':['投稿要求','<label>目标期刊与要求</label><textarea placeholder="篇幅、格式、材料清单…"></textarea>'],'social-plan':['确认研究范围','<label>平台</label><select><option>小红书</option><option>B 站</option><option>微博</option><option>知乎</option></select><label>查询关键词</label><input value="AI 批注 修改意见"><label>预算</label><input value="最多 3 次查询 / 15 条结果"><p>确认前显示需使用的来源与登录状态。演示不会发出采集请求。</p>'],'social-results':['研究结果设计','<p><span class="pill pending">待核实</span> 每条结果展示平台、标题、摘录、原始链接与采集时间。</p><blockquote>用户反馈示例：修改意见多了之后，很难知道哪条已经处理。</blockquote><div class="actions"><button data-note="演示：选定结果后可加入资料库，并保留来源状态。">加入资料库</button><button data-note="演示：勾选相关结果后再整理研究提示词。">用于报告提示词</button></div>'],'learning':['待确认的偏好建议','<p>系统观察到你多次要求“先给结论”，但只有你确认后才保存为生效偏好。</p><label>适用范围</label><select><option>当前任务</option><option>当前领域</option><option>全局</option></select>'],'connection':['搜索服务连接','<label>服务地址</label><input placeholder="填写已配置的服务地址"><p>凭证由宿主管理。连接测试结果单独显示。</p>'],'backup-export':['确认备份范围','<p>任务、资料关联、提示词版本和批注。</p><p>导出前展示附件数量与是否包含偏好；凭证不进入备份。</p>'],'backup-restore':['恢复预览 · 示例','<p>识别到：任务 2 项、资料 5 项、批注 3 条。</p><label>恢复方式</label><select><option>合并到现有工作空间</option><option>替换现有数据</option></select><p>真实执行前还应展示冲突与影响，并创建必要备份。</p>'],'migration-preview':['迁移预览 · 示例','<p>已识别类别：任务、提示词、资料。附件与关联关系单独列出。</p><label>导入范围</label><select><option>所选类别</option><option>全部兼容类别</option></select><p>不支持的字段明确列出，确认前不写入数据。</p>']};const [title,body]=contents[name];modal('<h2>'+title+'</h2>'+body+modalEnd('<button class="primary" data-demo-confirm>确认演示</button>'))}
function addAnnotation(selection,tool){lastSelection=selection;modal('<h2>'+esc(tool)+'</h2><blockquote>'+esc(selection||'当前页面 / 示例标记区域')+'</blockquote><label for="note-type">意见类型</label><select id="note-type"><option>修改</option><option>补充</option><option>核实</option><option>删除</option><option>保留</option></select><label for="note-text">希望怎样调整？</label><textarea id="note-text" placeholder="写下你的修改意见…"></textarea><p>选中内容、资料版本与意见一起保留。</p>'+modalEnd('<button class="primary" id="save-note">保存批注示例</button>'));}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){route=b.dataset.route;viewState='normal';if(b.dataset.home){workMode='chat';frameState='home'}if(b.dataset.work){workMode='chat';frameState='work'}$('nav').classList.remove('open');render()}
else if(b.dataset.sub){subtabs[route]=b.dataset.sub;render()}
else if(b.dataset.workMode){if($('generated-text'))promptDraft=$('generated-text').value;workMode=b.dataset.workMode;render()}
else if(b.dataset.frame){frameState=b.dataset.frame;render()}
else if(b.dataset.kind){readerKind=b.dataset.kind;render()}
else if(b.dataset.tool){selectedTool=b.dataset.tool;if(selectedTool==='文字批注'){toast('在页面中划选文字，即可添加批注。')}else addAnnotation('',selectedTool);}
else if(b.dataset.jump){const target=$(b.dataset.jump)||$('target-region');target?.scrollIntoView({block:'center',behavior:'smooth'});if(target){target.style.outline='2px solid #6d854c';setTimeout(()=>target.style.outline='',1800)}}
else if(b.dataset.prompt!==undefined){selectedPrompt=Number(b.dataset.prompt);compare=false;render()}
else if(b.dataset.article!==undefined){selectedArticle=Number(b.dataset.article);render()}
else if(b.dataset.modal)showNamedModal(b.dataset.modal);
else if(b.dataset.note)toast(b.dataset.note);
else if(b.hasAttribute('data-reset')){viewState='normal';render()}
else if(b.hasAttribute('data-close'))$('modal').close();
else if(b.hasAttribute('data-demo-confirm')){$('modal').close();toast('演示操作已确认；未修改真实数据。')}
else if(b.dataset.doc){modal('<h2>'+esc(b.dataset.doc)+'</h2><p>来源：用户添加 / 演示记录</p><p>摘要、验证状态、关联任务与批注在这里查看。</p><blockquote>资料正文打开后可选中或标记区域，批注关联其来源版本。</blockquote>'+modalEnd('<button class="primary" data-review>打开查看与批注</button>'))}
else if(b.hasAttribute('data-review')){if($('modal').open)$('modal').close();route='workbench';workMode='reader';viewState='normal';render()}
else if(b.dataset.use){modal('<h2>加入哪个任务？</h2><p>'+esc(b.dataset.use)+'</p><label for="target-task">目标任务</label><select id="target-task"><option>产品方案汇报</option><option>文章结构优化</option><option>新建任务</option></select>'+modalEnd('<button class="primary" data-demo-confirm>确认加入示例任务</button>'))}
else if(b.dataset.memory){modal('<h2>偏好来源与修改</h2><p>来源：用户明确确认 / 示例记录</p><label>偏好内容</label><textarea>'+esc(b.dataset.memory)+'</textarea><label>适用范围</label><select><option>当前任务</option><option>领域</option><option>全局</option></select>'+modalEnd('<button class="primary" data-demo-confirm>保存修改示例</button>'))}
else if(b.getAttribute('role')==='switch'){const enabled=b.getAttribute('aria-checked')==='true';b.setAttribute('aria-checked',String(!enabled));toast(enabled?'演示偏好已停用，可随时重新开启。':'演示偏好已开启。')}
else if(b.dataset.filter){document.querySelectorAll('#library-rows tr').forEach(row=>row.hidden=b.dataset.filter==='verified'&&row.dataset.verified!=='已核实'||b.dataset.filter==='pending'&&row.dataset.verified!=='待核实');document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));}
else switch(b.id){case 'nav-toggle':$('nav').classList.toggle('open');break;case 'page-description':modal('<h2>'+routes[route][0]+' · 页面设计</h2><p>'+explanations[route]+'</p>'+modalEnd());break;case 'compare-version':compare=true;render();break;case 'latest-version':compare=false;render();break;case 'annotation-toggle':annotationMode=!annotationMode;render();break;case 'comments-toggle':commentsOpen=!commentsOpen;render();break;case 'comments-close':commentsOpen=false;render();break;case 'focus-reader':previewFocus=!previewFocus;$('shell').classList.toggle('menu-compact',previewFocus);b.textContent=previewFocus?'还原工作区':'专注查看';break;case 'save-note':if(!$('note-text').value.trim()){$('note-text').focus();break}customAnnotation=$('note-type').value+'：'+$('note-text').value.trim();$('modal').close();commentsOpen=true;render();toast('批注已保留在本页演示状态中。');break;case 'generate-notes':{const chosen=[...document.querySelectorAll('.include-note:checked')].map(x=>x.value);if(!chosen.length){toast('请先选择本轮要使用的批注。');break}promptDraft='请根据所附资料修改当前内容。\n适用版本：示例快照 V1。\n\n'+(chosen.includes('1')?'1. 定位原文“系统就会自动完成所有工作”：改为准确说明需求梳理和修改提示词生成能力。\n':'')+(chosen.includes('2')?'2. 定位流程说明区域：突出“确定下一步”，降低辅助步骤的视觉权重。\n':'')+(chosen.includes('3')?'3. '+(lastSelection?'定位“'+lastSelection+'”：':'当前页面：')+customAnnotation+'\n':'')+'\n保留其余内容原意，并逐项说明修改结果。\n所需附件：当前资料快照'+(chosen.includes('2')?'、流程说明区域截图':'')+'。';workMode='prompt';render();break}case 'copy-generated':case 'copy-prompt':try{await navigator.clipboard.writeText(b.id==='copy-generated'?$('generated-text').value:promptEntries[selectedPrompt].body);toast('示例提示词已复制。')}catch{toast('复制未成功，可以选中正文手动复制。')}break;}});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){const query=e.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('#library-rows tr').forEach(row=>{row.hidden=!row.dataset.search.toLowerCase().includes(query);if(!row.hidden)count++});$('search-empty').hidden=count>0}});
document.addEventListener('mouseup',e=>{if(!e.target.closest('#source-document')||readerKind==='图片'||!annotationMode||selectedTool!=='文字批注')return;const selection=window.getSelection();const text=selection.toString().trim();if(text&&$('source-document').contains(selection.anchorNode)&&$('source-document').contains(selection.focusNode)){addAnnotation(text,'文字批注');selection.removeAllRanges()}});
$('state-select').onchange=e=>{viewState=e.target.value;render()};$('nav-main').innerHTML=Object.entries(routes).filter(([key])=>key!=='settings').map(([key,[name,ic]])=>'<button data-route="'+key+'">'+icon(ic)+name+'</button>').join('');render();
</script><script src="/files/product-flows.js"></script></body></html>
